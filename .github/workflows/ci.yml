name: ✅ CI 质量门禁

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python / Schema / Data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v7

      - name: 🐍 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: 🧹 Ruff
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          ruff check scripts tests/python 2>&1 | tee ci-logs/python-ruff.log

      - name: 🧪 Python tests
        run: |
          set -euo pipefail
          python -m pytest tests/python -v 2>&1 | tee ci-logs/python-tests.log

      - name: 🔍 Strict data gate
        run: |
          set -euo pipefail
          python scripts/verify_data.py 2>&1 | tee ci-logs/python-data.log

      - name: 📤 上传 Python 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-python-${{ github.run_id }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend / Typecheck / Unit / JSON Schema
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v7

      - name: 🟢 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 安装依赖
        run: npm ci

      - name: 🔎 Typecheck
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          npm run typecheck 2>&1 | tee ci-logs/frontend-typecheck.log

      - name: 🧹 ESLint
        run: |
          set -euo pipefail
          npm run lint 2>&1 | tee ci-logs/frontend-lint.log

      - name: 🧪 Frontend unit tests
        run: |
          set -euo pipefail
          npm run test:unit 2>&1 | tee ci-logs/frontend-unit.log

      - name: 🧬 JSON Schema validation
        run: |
          set -euo pipefail
          npm run test:schema 2>&1 | tee ci-logs/frontend-schema.log

      - name: 📤 上传前端日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-frontend-${{ github.run_id }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: Playwright Desktop / Mobile
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v7

      - name: 🟢 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 安装依赖
        run: npm ci

      - name: 🗃️ 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: 🌐 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 🧪 Playwright E2E
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          npm run test:e2e 2>&1 | tee ci-logs/e2e.log

      - name: 📤 上传 E2E 证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-e2e-${{ github.run_id }}
          path: |
            ci-logs/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  cross-browser:
    name: Firefox / WebKit
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v7

      - name: 🟢 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 安装依赖
        run: npm ci

      - name: 🌐 安装 Firefox 与 WebKit
        run: npx playwright install --with-deps firefox webkit

      - name: 🧪 Cross-browser smoke
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          npm run test:cross-browser 2>&1 | tee ci-logs/cross-browser.log

      - name: 📤 上传跨浏览器证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-cross-browser-${{ github.run_id }}
          path: |
            ci-logs/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v7

      - name: 🐍 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-runtime.lock

      - name: 🛡️ pip audit
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit -r requirements-runtime.lock 2>&1 | tee ci-logs/pip-audit.log

      - name: 🟢 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 🛡️ npm audit
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high 2>&1 | tee ci-logs/npm-audit.log

      - name: 📤 上传安全审计日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-security-${{ github.run_id }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14
