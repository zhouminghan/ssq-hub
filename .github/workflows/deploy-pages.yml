name: 🌐 部署到 GitHub Pages

"on":
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '!web/data/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_run:
    workflows:
      - '🎰 更新双色球数据'
      - '🛠️ 修复双色球历史数据'
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0

      - name: 🧭 按实际提交差异判定部署
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          NEED_DEPLOY=false
          REASON=direct_trigger
          CURR_SHA=$(git rev-parse HEAD)
          echo "checkout HEAD: $CURR_SHA"

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            REASON=no_web_changes
            echo "workflow_run head_sha: $RUN_SHA"

            if ! git cat-file -e "${RUN_SHA}^{commit}" 2>/dev/null; then
              echo "❌ 无法解析触发 workflow 的提交"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$RUN_SHA" "$CURR_SHA"; then
              echo "❌ RUN_SHA 不是当前 HEAD 的祖先，拒绝基于重写历史部署"
              exit 1
            fi

            if [ "$RUN_SHA" = "$CURR_SHA" ]; then
              REASON=no_new_commit
            else
              FILES=$(git diff --name-only "${RUN_SHA}..${CURR_SHA}")
              echo "RUN_SHA..HEAD 变更:"
              printf '%s\n' "$FILES"
              HAS_DATA=false
              HAS_WEB_NONDATA=false
              while IFS= read -r path; do
                [ -n "$path" ] || continue
                case "$path" in
                  web/data/*) HAS_DATA=true ;;
                  web/*) HAS_WEB_NONDATA=true ;;
                esac
              done <<< "$FILES"

              if [ "$HAS_DATA" = "true" ] || [ "$HAS_WEB_NONDATA" = "true" ]; then
                NEED_DEPLOY=true
                REASON=web_changes
              fi
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            NEED_DEPLOY=true
            REASON=manual_force
          else
            NEED_DEPLOY=true
          fi

          echo "need_deploy=$NEED_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "部署判断: need_deploy=$NEED_DEPLOY reason=$REASON"

      - name: 🐍 配置 Python 环境
        if: steps.gate.outputs.need_deploy == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-runtime.lock

      - name: 📦 安装部署校验依赖
        if: steps.gate.outputs.need_deploy == 'true'
        run: python -m pip install -r requirements-runtime.lock

      - name: 🔍 部署前数据校验
        if: steps.gate.outputs.need_deploy == 'true'
        run: |
          set -euo pipefail
          mkdir -p deploy-logs
          python scripts/verify_data.py 2>&1 | tee deploy-logs/verify.log

      - name: ⚙️ 配置 Pages
        if: steps.gate.outputs.need_deploy == 'true'
        uses: actions/configure-pages@v6

      - name: 🏷️ 自动更新时间戳
        if: steps.gate.outputs.need_deploy == 'true'
        run: |
          STAMP=$(date -u +'%Y%m%d%H%M')
          sed -i "s/?v=[0-9]*\"/?v=$STAMP\"/g" web/index.html
          echo "Cache buster: ?v=$STAMP"

      - name: 📦 打包站点 artifact
        if: steps.gate.outputs.need_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './web'

      - name: 🚀 发布到 GitHub Pages
        if: steps.gate.outputs.need_deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 🧾 收集部署失败诊断
        if: failure()
        run: |
          mkdir -p deploy-logs
          git rev-parse HEAD > deploy-logs/head-sha.log || true
          git status --short > deploy-logs/status.log || true

      - name: 📤 上传部署失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-failure-${{ github.run_id }}
          path: deploy-logs/
          if-no-files-found: warn
          retention-days: 14
