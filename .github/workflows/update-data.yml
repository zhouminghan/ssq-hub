name: 🎰 更新双色球数据

# Scheduled draws:
#   Tue/Thu/Sun 22:10 Asia/Shanghai = 14:10 UTC.
# Monthly maintenance:
#   2nd day 02:00 Asia/Shanghai = 1st day 18:00 UTC.
#
# fetch_latest.py owns source fallback and retries stale/empty source results
# three times at 10-minute intervals. During an official pause window it exits
# before network access; outside one, a total source outage fails the job.
"on":
  schedule:
    - cron: '10 14 * * 0,2,4'
    - cron: '0 18 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'incremental: check before fetch; full: force fetch and rebuild'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full

permissions:
  contents: write

# Serialize all remote protected-data writes.
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 配置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 🧭 判定运行模式
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="$INPUT_MODE"
          elif [ "$SCHEDULE" = "0 18 1 * *" ]; then
            MODE=full
          else
            MODE=incremental
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "运行模式: $MODE"

      - name: 🔍 发布前预检
        run: python scripts/verify_data.py

      - name: ⏭️ 判断本轮是否需要抓取
        id: check
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          TODAY=$(TZ='Asia/Shanghai' date '+%Y-%m-%d')
          LATEST_DATE=$(python -c "import json; print(json.load(open('web/data/latest.json'))['latest_draw']['date'])")
          echo "今日（北京时间）: $TODAY"
          echo "latest.json: $LATEST_DATE"

          if [ "$MODE" = "full" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "fetch=true" >> "$GITHUB_OUTPUT"
          elif [ "$LATEST_DATE" = "$TODAY" ]; then
            echo "fetch=false" >> "$GITHUB_OUTPUT"
            echo "本期数据已存在且预检通过，本次无需重复抓取"
          else
            echo "fetch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🌐 抓取最新开奖数据
        if: steps.check.outputs.fetch == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          LOTTERY_PAUSE_UNTIL: ${{ vars.LOTTERY_PAUSE_UNTIL }}
          LOTTERY_PAUSE_WINDOWS_FILE: web/config/lottery_pause_windows.json
          LOTTERY_PAUSE_WINDOWS_JSON: ${{ vars.LOTTERY_PAUSE_WINDOWS_JSON }}
        run: |
          set -euo pipefail
          FLAG=""
          if [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE" = "10 14 * * 0,2,4" ]; then
            FLAG="--require-new"
          fi
          python scripts/fetch_latest.py $FLAG

      - name: 📊 重算统计数据
        if: steps.check.outputs.fetch == 'true'
        run: python scripts/calc_all.py

      - name: 🔍 数据质量门禁
        if: steps.check.outputs.fetch == 'true'
        run: python scripts/verify_data.py

      - name: 🧾 检查数据变更范围
        id: changes
        if: steps.check.outputs.fetch == 'true'
        run: |
          set -euo pipefail
          git add -A -- web/data
          CHANGED=$(git diff --cached --name-only)
          if [ -z "$CHANGED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "数据无变化，不创建提交"
            exit 0
          fi

          UNEXPECTED=$(printf '%s\n' "$CHANGED" | grep -Ev \
            '^web/data/(history/[0-9]{4}\.json|history_index\.json|stats\.json|latest\.json|manifest\.json|history_baseline\.json|corrections\.json|source_state\.json)$' \
            || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "❌ 检测到非预期数据变更:"
            printf '%s\n' "$UNEXPECTED"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --cached --name-status

      - name: 💾 提交并推送数据
        if: steps.changes.outputs.changed == 'true'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          CHANGES=$(git diff --cached --stat | tail -1)
          TS=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M 北京时间')
          git commit -m "chore(data): 自动更新 @ $TS [$MODE] | ${CHANGES}"

          BRANCH="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            echo "push 被拒绝，执行第 ${attempt}/3 次对账恢复"
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              git rebase --abort
              echo "上游同时修改了生成数据，拒绝自动覆盖并结束"
              exit 1
            fi
            python scripts/verify_data.py
          done
          echo "连续 push 竞争失败，保留失败诊断等待人工处理"
          exit 1
