[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["scripts"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".git", "node_modules", "web/data", "test-results", "playwright-report"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
