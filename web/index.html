<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="双色球历史数据分析与可视化平台：3500+ 期开奖走势、遗漏、频次、区间与结构统计。" />
  <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#10141c" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SSQ Hub · 双色球数据洞察" />
  <meta property="og:description" content="3500+ 期双色球历史走势、遗漏与结构统计。数据自动更新，适配桌面和移动端。" />
  <meta property="og:url" content="https://zhouminghan.github.io/ssq-hub/" />
  <meta property="og:image" content="https://zhouminghan.github.io/ssq-hub/assets/img/og-cover.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SSQ Hub · 双色球数据洞察" />
  <meta name="twitter:description" content="3500+ 期双色球历史走势、遗漏与结构统计。" />
  <meta name="twitter:image" content="https://zhouminghan.github.io/ssq-hub/assets/img/og-cover.png" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "SSQ Hub 双色球数据洞察",
    "url": "https://zhouminghan.github.io/ssq-hub/",
    "description": "双色球历史走势、遗漏、频次与结构统计分析平台。",
    "applicationCategory": "DataAnalysisApplication",
    "operatingSystem": "Web",
    "isAccessibleForFree": true
  }
  </script>
  <title>SSQ Hub · 双色球数据洞察</title>
  <link rel="canonical" href="https://zhouminghan.github.io/ssq-hub/" />
  <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml" />
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme',
        saved === 'light' || saved === 'dark' ? saved : (dark ? 'dark' : 'light'));
    })();
  </script>
  <link rel="stylesheet" href="./css/reset.css?v=20261114" />
  <link rel="stylesheet" href="./css/theme.css?v=20261114" />
  <link rel="stylesheet" href="./css/layout.css?v=20261114" />
  <link rel="stylesheet" href="./css/filter-bar.css?v=20261114" />
  <link rel="stylesheet" href="./css/trend-table.css?v=20261114" />
  <link rel="stylesheet" href="./css/trend-overlay.css?v=20261114" />
  <link rel="stylesheet" href="./css/number-profile.css?v=20261114" />
  <link rel="stylesheet" href="./css/insights.css?v=20261114" />
  <link rel="stylesheet" href="./css/responsive.css?v=20261114" />
</head>
<body>
  <nav class="skip-nav" aria-label="辅助导航">
    <a href="#trend-view" class="skip-link">跳到走势图</a>
  </nav>

  <header class="app-header">
    <a class="header-brand" href="./">
      <span class="brand-mark" aria-hidden="true">
        <span></span><span></span>
      </span>
      <span class="brand-copy">
        <h1>SSQ Hub</h1>
        <small>双色球数据洞察</small>
      </span>
    </a>

    <nav class="app-nav" aria-label="主要视图">
      <button class="app-nav-item active" type="button" data-view="trend" aria-current="page">走势分析</button>
      <button class="app-nav-item" type="button" data-view="insights">数据洞察</button>
    </nav>

    <div class="header-actions">
      <a class="github-link" href="https://github.com/zhouminghan/ssq-hub"
         target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看 SSQ Hub 源码">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2.17c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.04 1.77 2.72 1.26 3.38.97.1-.75.4-1.26.74-1.55-2.57-.3-5.27-1.29-5.27-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.19-1.49 3.15-1.18 3.15-1.18.64 1.59.24 2.77.12 3.06.74.81 1.19 1.84 1.19 3.1 0 4.42-2.71 5.39-5.29 5.68.42.36.78 1.06.78 2.14v3.17c0 .31.21.67.79.56A11.5 11.5 0 0 0 12 .7Z"/>
        </svg>
        <span>GitHub</span>
      </a>

      <div class="theme-dropdown" id="theme-dropdown">
        <button class="theme-trigger" id="theme-trigger" type="button"
                aria-haspopup="listbox" aria-expanded="false" aria-label="选择主题">
          <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
          <span id="theme-label">跟随系统</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="theme-menu" id="theme-menu" role="listbox" hidden>
          <button class="theme-item" data-theme="auto" role="option" type="button">
            <span>跟随系统</span><span class="theme-check" aria-hidden="true">✓</span>
          </button>
          <button class="theme-item" data-theme="light" role="option" type="button">
            <span>浅色</span><span class="theme-check" aria-hidden="true">✓</span>
          </button>
          <button class="theme-item" data-theme="dark" role="option" type="button">
            <span>深色</span><span class="theme-check" aria-hidden="true">✓</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <section class="overview" id="overview" aria-label="数据概览">
    <div class="overview-draw">
      <div class="overview-heading">
        <span>最新开奖</span>
        <strong id="overview-issue">加载中</strong>
        <span id="overview-date"></span>
        <span class="overview-scale" id="overview-scale"></span>
      </div>
      <div class="draw-balls" id="overview-balls" aria-label="最新一期开奖号码"></div>
    </div>
    <div class="overview-metrics" id="overview-metrics" aria-label="数据集指标">
      <div class="overview-metric">
        <span>历史样本</span>
        <strong id="metric-total">—</strong>
      </div>
      <div class="overview-metric">
        <span>覆盖年份</span>
        <strong id="metric-years">—</strong>
      </div>
      <div class="overview-metric">
        <span>数据状态</span>
        <strong class="data-status" id="metric-status">读取中</strong>
      </div>
    </div>
  </section>

  <section class="filter-bar" id="filter-bar" aria-label="走势筛选">
    <!-- mounted by filter-bar.js -->
  </section>

  <main class="main-region" id="main-region">
    <section class="trend-view" id="trend-view" aria-labelledby="trend-title">
      <div class="section-heading">
        <div>
          <h2 id="trend-title">号码走势</h2>
          <p id="trend-summary">红球遗漏、蓝球轨迹与结构指标</p>
        </div>
        <div class="trend-legend" aria-label="图例">
          <span><i class="legend-dot red"></i>红球</span>
          <span><i class="legend-dot blue"></i>蓝球</span>
          <span><i class="legend-dot recent"></i>近 5 期</span>
        </div>
      </div>

      <div class="trend-panel">
        <div class="trend-loading" id="trend-loading" role="status" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <span>正在加载走势数据</span>
        </div>
        <div class="trend-sticky-header" id="trend-sticky-header" aria-hidden="true" hidden>
          <div class="trend-sticky-track" id="trend-sticky-track"></div>
          <div class="trend-sticky-issue" id="trend-sticky-issue">期号</div>
        </div>
        <div class="trend-scroll" id="trend-scroll" hidden>
          <div class="trend-canvas">
            <table class="trend-table" id="trend-table">
              <!-- mounted by trend-table.js -->
            </table>
            <svg class="trend-overlay" id="trend-overlay" aria-hidden="true"></svg>
          </div>
        </div>
      </div>
    </section>

    <section class="insights-view" id="insights-view" aria-labelledby="insights-title" hidden>
      <div class="section-heading">
        <div>
          <h2 id="insights-title">数据洞察</h2>
          <p>基于完整历史与最近 100 期的结构统计</p>
        </div>
        <span class="section-note" id="insights-window">近 100 期</span>
      </div>
      <div class="insights-grid" id="insights-grid">
        <div class="insights-loading"><span class="spinner" aria-hidden="true"></span>正在计算概览</div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <span>数据来自公开开奖记录</span>
    <span class="footer-sep" aria-hidden="true">·</span>
    <span>历史数据不预测未来</span>
    <a href="https://github.com/zhouminghan/ssq-hub" target="_blank" rel="noopener noreferrer">项目源码</a>
  </footer>

  <script>
    window.__ssqBooted = false;
    window.setTimeout(function () {
      if (window.__ssqBooted) return;
      var loading = document.getElementById('trend-loading');
      if (!loading) return;
      loading.className = 'trend-loading trend-error';
      loading.innerHTML = '';
      var message = document.createElement('span');
      message.className = 'error-text';
      message.textContent = '应用资源加载失败，请检查网络后重试';
      var retry = document.createElement('button');
      retry.className = 'btn-retry';
      retry.type = 'button';
      retry.textContent = '重新加载';
      retry.onclick = function () { location.reload(); };
      loading.append(message, retry);
    }, 12000);
  </script>
  <script type="module" src="./js/main.js?v=20261114"></script>
  <noscript><p class="noscript">本应用需要 JavaScript 才能运行。</p></noscript>
</body>
</html>
